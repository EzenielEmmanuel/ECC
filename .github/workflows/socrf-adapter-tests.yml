name: SOCRF Adapter Tests

on:
  push:
    branches: [socrf-development]
    paths:
      - 'socrf/**'
      - '.github/workflows/socrf-adapter-tests.yml'
  pull_request:
    paths:
      - 'socrf/**'
      - '.github/workflows/socrf-adapter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SOCRF dry-run tests
        run: python -m unittest discover -s socrf/tests -v
